<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;}html,body{margin:0;padding:0;height:100%;}::selection{background:#3A2A21;}.scrl::-webkit-scrollbar{width:10px;}.scrl::-webkit-scrollbar-thumb{background:#3A342C;border-radius:8px;border:3px solid transparent;background-clip:content-box;}</style>
</helmet>
<div style="display:flex;height:100vh;width:100%;overflow:hidden;background:#1B1815;color:#ECE6DB;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;">
  <dc-import name="Sidebar" active="npcs" hint-size="236px,100%" style="flex:0 0 236px;height:100vh;"></dc-import>
  <main class="scrl" style="flex:1;overflow-y:auto;">
    <div style="max-width:1080px;padding:34px 40px 60px;">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;">
        <div>
          <h1 style="font-family:'Newsreader',serif;font-size:32px;font-weight:600;margin:0 0 3px;letter-spacing:-.3px;color:#F4EFE6;">NPCs</h1>
          <p style="margin:0;color:#8A8175;font-size:14.5px;">Los rostros que tus jugadores encontrarán en el camino.</p>
        </div>
        <button style="display:flex;align-items:center;gap:7px;background:#CE6A3A;color:#1B1815;border:none;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;" style-hover="background:#D97C4E;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Nuevo NPC</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;">
        <sc-for list="{{ npcs }}" as="n" hint-placeholder-count="4">
          <div style="display:flex;gap:15px;background:#221E19;border:1px solid #2E2A24;border-radius:14px;padding:18px;cursor:pointer;transition:border-color .15s,box-shadow .15s;" style-hover="border-color:#4A4237;box-shadow:0 6px 20px rgba(0,0,0,.28);">
            <span style="width:52px;height:52px;border-radius:13px;background:{{ n.bg }};color:{{ n.color }};display:flex;align-items:center;justify-content:center;font-family:'Newsreader',serif;font-size:22px;font-weight:600;flex:0 0 auto;">{{ n.initial }}</span>
            <div style="flex:1;min-width:0;">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px;"><span style="font-family:'Newsreader',serif;font-size:18px;font-weight:600;color:#F1ECE2;">{{ n.name }}</span><span style="{{ n.dispStyle }}">{{ n.disp }}</span></div>
              <div style="font-size:12.5px;color:#8A8175;margin-bottom:9px;">{{ n.role }} · {{ n.loc }}</div>
              <p style="margin:0;font-size:12.5px;line-height:1.5;color:#B4AB9D;">{{ n.desc }}</p>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  DISP = { Aliado:{t:'#9DC08B',b:'#22301E'}, Neutral:{t:'#DBB55F',b:'#332B17'}, Hostil:{t:'#E79B72',b:'#38241B'} };
  renderVals() {
    const badge = (d) => { const c = this.DISP[d]; return 'font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:'+c.b+';color:'+c.t+';'; };
    const raw = [
      { name: 'El pescador ciego', role: 'Guía', loc: 'Claro del arroyo', disp: 'Aliado', initial: 'P', bg: '#22301E', color: '#9DC08B', desc: 'Anciano que conoce el camino a la cripta. Pide un favor a cambio.' },
      { name: 'Garrek', role: 'Cabecilla bandido', loc: 'Entrada del bosque', disp: 'Hostil', initial: 'G', bg: '#38241B', color: '#E79B72', desc: 'Exige peaje en el vado. Cobarde si se le planta cara con fuerza.' },
      { name: 'La Custodia', role: 'Voz tras la piedra', loc: 'Puerta sellada', disp: 'Neutral', initial: 'C', bg: '#332B17', color: '#DBB55F', desc: 'Presencia atrapada tras el muro. Negocia, pero sus motivos son oscuros.' },
      { name: 'Mara la mercader', role: 'Comerciante', loc: 'Campamento', disp: 'Neutral', initial: 'M', bg: '#312330', color: '#CFA0BF', desc: 'Vende suministros a precios altos. Rumores fiables a cambio de oro.' }
    ];
    return { npcs: raw.map(n => ({ ...n, dispStyle: badge(n.disp) })) };
  }
}
</script>
</body>
</html>
