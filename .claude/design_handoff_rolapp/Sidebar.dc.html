<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:236,&quot;height&quot;:760},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dashboard&quot;,&quot;campanas&quot;,&quot;prep&quot;,&quot;habilidades&quot;,&quot;pbase&quot;,&quot;atributos&quot;,&quot;personajes&quot;,&quot;items&quot;,&quot;npcs&quot;,&quot;historial&quot;],&quot;default&quot;:&quot;dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || 'dashboard';
    const base = 'display:flex;align-items:center;gap:11px;padding:8px 12px;margin:1px 10px;border-radius:9px;text-decoration:none;font-size:13.5px;font-family:inherit;cursor:pointer;';
    const mk = (key) => {
      if (key === active) {
        const s = base + 'color:#E08A5C;background:#33251C;font-weight:600;box-shadow:inset 3px 0 0 #CE6A3A;';
        return { style: s, hover: s };
      }
      return { style: base + 'color:#ACA396;font-weight:500;', hover: base + 'color:#F1ECE2;font-weight:500;background:#282420;' };
    };
    const keys = ['dashboard','campanas','prep','habilidades','pbase','atributos','personajes','items','npcs','historial'];
    const nav = {};
    keys.forEach(k => { nav[k] = mk(k); });
    return { nav };
  }
}
</script>
