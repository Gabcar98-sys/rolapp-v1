<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;}html,body{margin:0;padding:0;height:100%;}::selection{background:#3A2A21;}.scrl::-webkit-scrollbar{width:10px;}.scrl::-webkit-scrollbar-thumb{background:#3A342C;border-radius:8px;border:3px solid transparent;background-clip:content-box;}input::placeholder{color:#6E6659;}</style>
</helmet>
<div style="display:flex;height:100vh;width:100%;overflow:hidden;background:#1B1815;color:#ECE6DB;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;">
  <dc-import name="Sidebar" active="items" hint-size="236px,100%" style="flex:0 0 236px;height:100vh;"></dc-import>
  <main class="scrl" style="flex:1;overflow-y:auto;">
    <div style="max-width:1080px;padding:34px 40px 60px;">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;">
        <div>
          <h1 style="font-family:'Newsreader',serif;font-size:32px;font-weight:600;margin:0 0 3px;letter-spacing:-.3px;color:#F4EFE6;">Items</h1>
          <p style="margin:0;color:#8A8175;font-size:14.5px;">Equipo, consumibles y tesoros que pueblan tu mundo.</p>
        </div>
        <button style="display:flex;align-items:center;gap:7px;background:#CE6A3A;color:#1B1815;border:none;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;" style-hover="background:#D97C4E;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Nuevo item</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
          <div style="background:#221E19;border:1px solid #2E2A24;border-radius:14px;padding:18px;cursor:pointer;transition:border-color .15s,box-shadow .15s;position:relative;" style-hover="border-color:#4A4237;box-shadow:0 6px 20px rgba(0,0,0,.28);">
            <span style="position:absolute;top:14px;right:14px;width:8px;height:8px;border-radius:50%;background:{{ it.rarityColor }};box-shadow:0 0 0 3px {{ it.rarityGlow }};" title="{{ it.rarity }}"></span>
            <span style="width:44px;height:44px;border-radius:11px;background:{{ it.bg }};color:{{ it.color }};display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:13px;">{{ it.glyph }}</span>
            <div style="font-weight:600;font-size:15px;color:#F1ECE2;margin-bottom:3px;">{{ it.name }}</div>
            <div style="font-size:12px;color:#8A8175;margin-bottom:11px;">{{ it.type }} · {{ it.rarity }}</div>
            <p style="margin:0 0 12px;font-size:12.5px;line-height:1.5;color:#B4AB9D;">{{ it.desc }}</p>
            <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:#DBB55F;font-weight:600;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v8M9.5 10h5M9.5 14h5" stroke-linecap="round"></path></svg>{{ it.value }}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  RAR = { Común:{c:'#9A9182',g:'#2E2A23'}, Raro:{c:'#9DC08B',g:'#22301E'}, Épico:{c:'#CFA0BF',g:'#312330'}, Legendario:{c:'#DBB55F',g:'#332B17'} };
  renderVals() {
    const raw = [
      { name: 'Espada del vado', type: 'Arma', rarity: 'Raro', glyph: '⚔', bg: '#38241B', color: '#E79B72', desc: '+2 al daño. Recuperada del cadáver de un bandido.', value: '120 mo' },
      { name: 'Escudo de roble', type: 'Armadura', rarity: 'Común', glyph: '⛨', bg: '#22301E', color: '#9DC08B', desc: 'Absorbe el primer golpe de cada combate.', value: '45 mo' },
      { name: 'Poción menor', type: 'Consumible', rarity: 'Común', glyph: '⚗', bg: '#312330', color: '#CFA0BF', desc: 'Restaura una pequeña cantidad de vitalidad.', value: '15 mo' },
      { name: 'Sello de Vhalmar', type: 'Reliquia', rarity: 'Legendario', glyph: '◈', bg: '#332B17', color: '#DBB55F', desc: 'Abre la puerta sellada de la cripta. Único.', value: '—' },
      { name: 'Capa sombría', type: 'Armadura', rarity: 'Épico', glyph: '❖', bg: '#2A2A33', color: '#A9AEC9', desc: 'Ventaja en tiradas de sigilo nocturnas.', value: '300 mo' },
      { name: 'Antorcha eterna', type: 'Utilidad', rarity: 'Raro', glyph: '✦', bg: '#38241B', color: '#E79B72', desc: 'Luz que no se apaga bajo el agua ni el viento.', value: '80 mo' }
    ];
    return { items: raw.map(i => { const r = this.RAR[i.rarity]; return { ...i, rarityColor: r.c, rarityGlow: r.g }; }) };
  }
}
</script>
</body>
</html>
