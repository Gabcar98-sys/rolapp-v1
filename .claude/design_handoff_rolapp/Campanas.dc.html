<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;}html,body{margin:0;padding:0;height:100%;}::selection{background:#3A2A21;}.scrl::-webkit-scrollbar{width:10px;}.scrl::-webkit-scrollbar-thumb{background:#3A342C;border-radius:8px;border:3px solid transparent;background-clip:content-box;}</style>
</helmet>
<div style="display:flex;height:100vh;width:100%;overflow:hidden;background:#1B1815;color:#ECE6DB;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;">
  <dc-import name="Sidebar" active="campanas" hint-size="236px,100%" style="flex:0 0 236px;height:100vh;"></dc-import>
  <main class="scrl" style="flex:1;overflow-y:auto;">
    <div style="max-width:1080px;padding:34px 40px 60px;">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px;">
        <div>
          <h1 style="font-family:'Newsreader',serif;font-size:32px;font-weight:600;margin:0 0 3px;letter-spacing:-.3px;color:#F4EFE6;">Campañas</h1>
          <p style="margin:0;color:#8A8175;font-size:14.5px;">Tus mundos y las sesiones que los habitan.</p>
        </div>
        <button style="display:flex;align-items:center;gap:7px;background:#CE6A3A;color:#1B1815;border:none;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;" style-hover="background:#D97C4E;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Nueva campaña</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;">
        <sc-for list="{{ campaigns }}" as="c" hint-placeholder-count="3">
          <div style="background:#221E19;border:1px solid #2E2A24;border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s;" style-hover="border-color:#4A4237;box-shadow:0 6px 20px rgba(0,0,0,.28);">
            <div style="height:6px;background:{{ c.accent }};"></div>
            <div style="padding:18px 20px 20px;">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
                <span style="{{ c.statusStyle }}">{{ c.status }}</span>
                <span style="font-size:12px;color:#8A8175;">{{ c.system }}</span>
              </div>
              <div style="font-family:'Newsreader',serif;font-size:21px;font-weight:600;color:#F1ECE2;line-height:1.2;margin-bottom:6px;">{{ c.name }}</div>
              <p style="margin:0 0 16px;font-size:13.5px;line-height:1.5;color:#B4AB9D;">{{ c.desc }}</p>
              <div style="display:flex;gap:18px;border-top:1px solid #2A2620;padding-top:13px;">
                <div><div style="font-family:'Newsreader',serif;font-size:19px;font-weight:600;color:#F1ECE2;">{{ c.players }}</div><div style="font-size:11px;color:#8A8175;text-transform:uppercase;letter-spacing:.6px;">Jugadores</div></div>
                <div><div style="font-family:'Newsreader',serif;font-size:19px;font-weight:600;color:#F1ECE2;">{{ c.sessions }}</div><div style="font-size:11px;color:#8A8175;text-transform:uppercase;letter-spacing:.6px;">Sesiones</div></div>
                <div style="flex:1;"></div>
                <a href="Preparar Sesion.dc.html" style="align-self:center;font-size:12.5px;font-weight:600;color:#E08A5C;text-decoration:none;">Abrir →</a>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const st = (active) => active
      ? 'font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:#22301E;color:#9DC08B;'
      : 'font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:#2E2A23;color:#9A9182;';
    return { campaigns: [
      { name: 'La Cripta de Vhalmar', system: 'Genérico', accent: '#CE6A3A', status: 'Activa', statusStyle: st(true), desc: 'Una tumba olvidada bajo el bosque guarda un sello que nadie debió romper.', players: 4, sessions: 8 },
      { name: 'Mareas de Ceniza', system: 'Genérico', accent: '#9E7890', status: 'Activa', statusStyle: st(true), desc: 'Un puerto moribundo, tres facciones y una flota fantasma en el horizonte.', players: 3, sessions: 5 },
      { name: 'El Concilio Roto', system: 'Genérico', accent: '#7C9668', status: 'Pausada', statusStyle: st(false), desc: 'Intriga política en una ciudad-estado donde cada favor tiene su precio.', players: 5, sessions: 11 }
    ]};
  }
}
</script>
</body>
</html>
