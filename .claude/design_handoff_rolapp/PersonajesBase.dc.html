<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;}html,body{margin:0;padding:0;height:100%;}::selection{background:#3A2A21;}.scrl::-webkit-scrollbar{width:10px;}.scrl::-webkit-scrollbar-thumb{background:#3A342C;border-radius:8px;border:3px solid transparent;background-clip:content-box;}</style>
</helmet>
<div style="display:flex;height:100vh;width:100%;overflow:hidden;background:#1B1815;color:#ECE6DB;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;">
  <dc-import name="Sidebar" active="pbase" hint-size="236px,100%" style="flex:0 0 236px;height:100vh;"></dc-import>
  <main class="scrl" style="flex:1;overflow-y:auto;">
    <div style="max-width:1080px;padding:34px 40px 60px;">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:8px;">
        <div>
          <h1 style="font-family:'Newsreader',serif;font-size:32px;font-weight:600;margin:0 0 3px;letter-spacing:-.3px;color:#F4EFE6;">Personajes Base</h1>
          <p style="margin:0;color:#8A8175;font-size:14.5px;">Plantillas reutilizables: clases y arquetipos que definen el punto de partida.</p>
        </div>
        <button style="display:flex;align-items:center;gap:7px;background:#CE6A3A;color:#1B1815;border:none;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;" style-hover="background:#D97C4E;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Nueva plantilla</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:20px;">
        <sc-for list="{{ bases }}" as="b" hint-placeholder-count="4">
          <div style="background:#221E19;border:1px solid #2E2A24;border-radius:14px;padding:20px;cursor:pointer;transition:border-color .15s,box-shadow .15s;" style-hover="border-color:#4A4237;box-shadow:0 6px 20px rgba(0,0,0,.28);">
            <div style="display:flex;align-items:center;gap:13px;margin-bottom:16px;">
              <span style="width:46px;height:46px;border-radius:11px;background:{{ b.bg }};color:{{ b.color }};display:flex;align-items:center;justify-content:center;font-family:'Newsreader',serif;font-size:22px;font-weight:600;flex:0 0 auto;">{{ b.glyph }}</span>
              <div><div style="font-family:'Newsreader',serif;font-size:19px;font-weight:600;color:#F1ECE2;line-height:1.15;">{{ b.name }}</div><div style="font-size:12.5px;color:#8A8175;">{{ b.role }}</div></div>
            </div>
            <div style="display:flex;flex-direction:column;gap:9px;">
              <sc-for list="{{ b.stats }}" as="st" hint-placeholder-count="3">
                <div style="display:flex;align-items:center;gap:10px;">
                  <span style="font-size:12px;color:#8A8175;width:52px;flex:0 0 auto;">{{ st.label }}</span>
                  <div style="flex:1;height:6px;border-radius:4px;background:#2A2620;overflow:hidden;"><div style="height:100%;width:{{ st.pct }}%;background:{{ b.color }};border-radius:4px;"></div></div>
                  <span style="font-size:12px;color:#B4AB9D;width:24px;text-align:right;font-variant-numeric:tabular-nums;">{{ st.val }}</span>
                </div>
              </sc-for>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:15px;padding-top:14px;border-top:1px solid #2A2620;">
              <sc-for list="{{ b.skills }}" as="sk" hint-placeholder-count="2"><span style="font-size:11.5px;color:#B4AB9D;background:#2A2620;padding:4px 10px;border-radius:20px;">{{ sk }}</span></sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const S = (fue,des,men,vit) => [
      { label: 'Fuerza', val: fue, pct: fue*10 },
      { label: 'Destreza', val: des, pct: des*10 },
      { label: 'Mente', val: men, pct: men*10 },
      { label: 'Vitalidad', val: vit, pct: vit*10 }
    ];
    return { bases: [
      { name: 'Guerrero', role: 'Vanguardia', glyph: '⚔', bg: '#38241B', color: '#E79B72', stats: S(9,5,3,8), skills: ['Tajo demoledor','Muro de escudos'] },
      { name: 'Explorador', role: 'A distancia', glyph: '➹', bg: '#22301E', color: '#9DC08B', stats: S(5,9,5,6), skills: ['Lluvia de flechas','Reflejos felinos'] },
      { name: 'Sanador', role: 'Apoyo', glyph: '✚', bg: '#312330', color: '#CFA0BF', stats: S(3,5,9,6), skills: ['Palabra sanadora','Voz de mando'] },
      { name: 'Erudito', role: 'Control', glyph: '◈', bg: '#332B17', color: '#DBB55F', stats: S(2,6,10,4), skills: ['Sello arcano','Visión'] }
    ]};
  }
}
</script>
</body>
</html>
