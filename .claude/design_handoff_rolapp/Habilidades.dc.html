<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;}html,body{margin:0;padding:0;height:100%;}::selection{background:#3A2A21;}.scrl::-webkit-scrollbar{width:10px;}.scrl::-webkit-scrollbar-thumb{background:#3A342C;border-radius:8px;border:3px solid transparent;background-clip:content-box;}input::placeholder{color:#6E6659;}</style>
</helmet>
<div style="display:flex;height:100vh;width:100%;overflow:hidden;background:#1B1815;color:#ECE6DB;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;">
  <dc-import name="Sidebar" active="habilidades" hint-size="236px,100%" style="flex:0 0 236px;height:100vh;"></dc-import>
  <main class="scrl" style="flex:1;overflow-y:auto;">
    <div style="max-width:1080px;padding:34px 40px 60px;">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;">
        <div>
          <h1 style="font-family:'Newsreader',serif;font-size:32px;font-weight:600;margin:0 0 3px;letter-spacing:-.3px;color:#F4EFE6;">Habilidades</h1>
          <p style="margin:0;color:#8A8175;font-size:14.5px;">Define las capacidades que tus personajes pueden aprender.</p>
        </div>
        <button style="display:flex;align-items:center;gap:7px;background:#CE6A3A;color:#1B1815;border:none;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;" style-hover="background:#D97C4E;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Nueva habilidad</button>
      </div>
      <div style="display:flex;gap:10px;margin-bottom:18px;align-items:center;">
        <div style="flex:1;position:relative;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6659" stroke-width="1.8" style="position:absolute;left:13px;top:50%;transform:translateY(-50%);"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5" stroke-linecap="round"></path></svg><input placeholder="Buscar habilidad…" style="width:100%;background:#221E19;border:1px solid #2E2A24;border-radius:10px;padding:10px 14px 10px 38px;color:#ECE6DB;font-size:14px;"></div>
        <sc-for list="{{ types }}" as="t" hint-placeholder-count="4"><button style="{{ t.style }}">{{ t.name }}</button></sc-for>
      </div>
      <div style="background:#221E19;border:1px solid #2E2A24;border-radius:14px;overflow:hidden;">
        <div style="display:grid;grid-template-columns:2fr 1fr 1fr 90px;gap:14px;padding:12px 20px;border-bottom:1px solid #2A2620;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:#6E6659;">
          <span>Habilidad</span><span>Tipo</span><span>Coste</span><span></span>
        </div>
        <sc-for list="{{ skills }}" as="s" hint-placeholder-count="6">
          <div style="display:grid;grid-template-columns:2fr 1fr 1fr 90px;gap:14px;padding:14px 20px;border-bottom:1px solid #221E18;align-items:center;" style-hover="background:#26221C;">
            <div style="display:flex;align-items:center;gap:12px;min-width:0;">
              <span style="width:34px;height:34px;border-radius:9px;background:{{ s.iconBg }};color:{{ s.iconColor }};display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-family:'Newsreader',serif;font-weight:600;font-size:15px;">{{ s.glyph }}</span>
              <div style="min-width:0;"><div style="font-weight:600;font-size:14px;color:#F1ECE2;">{{ s.name }}</div><div style="font-size:12px;color:#8A8175;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ s.desc }}</div></div>
            </div>
            <span style="{{ s.typeStyle }}">{{ s.type }}</span>
            <span style="font-size:13.5px;color:#B4AB9D;">{{ s.cost }}</span>
            <div style="display:flex;gap:4px;justify-content:flex-end;">
              <span style="width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#8A8175;cursor:pointer;" style-hover="background:#2E2A22;color:#ECE6DB;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6-11 11H3v-6z"></path></svg></span>
              <span style="width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#A87D72;cursor:pointer;" style-hover="background:#3A231F;color:#E4785E;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M6 7l1 13h10l1-13"></path></svg></span>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  CAT = {
    Ataque:  { text: '#E79B72', bg: '#38241B' },
    Defensa: { text: '#9DC08B', bg: '#22301E' },
    Apoyo:   { text: '#CFA0BF', bg: '#312330' },
    Pasiva:  { text: '#DBB55F', bg: '#332B17' }
  };
  renderVals() {
    const chip = (a) => a
      ? 'font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:9px;border:1px solid #CE6A3A;background:#33251C;color:#E08A5C;cursor:pointer;font-family:inherit;'
      : 'font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:9px;border:1px solid #2E2A24;background:#221E19;color:#ACA396;cursor:pointer;font-family:inherit;';
    const types = ['Todas','Ataque','Defensa','Apoyo','Pasiva'].map((n,i) => ({ name: n, style: chip(i===0) }));
    const badge = (t) => { const c = this.CAT[t]; return 'font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:3px 9px;border-radius:20px;width:max-content;background:'+c.bg+';color:'+c.text+';'; };
    const raw = [
      { name: 'Tajo demoledor', desc: 'Golpe pesado que ignora parte de la armadura.', type: 'Ataque', cost: '2 PA', glyph: '⚔' },
      { name: 'Muro de escudos', desc: 'Reduce el daño recibido durante un turno.', type: 'Defensa', cost: '1 PA', glyph: '⛨' },
      { name: 'Palabra sanadora', desc: 'Restaura vitalidad a un aliado cercano.', type: 'Apoyo', cost: '2 PA', glyph: '✚' },
      { name: 'Reflejos felinos', desc: 'Mejora permanente de esquiva.', type: 'Pasiva', cost: '—', glyph: '◈' },
      { name: 'Lluvia de flechas', desc: 'Daño en área a distancia media.', type: 'Ataque', cost: '3 PA', glyph: '➹' },
      { name: 'Voz de mando', desc: 'Otorga una acción extra a un aliado.', type: 'Apoyo', cost: '3 PA', glyph: '❖' }
    ];
    const skills = raw.map(s => { const c = this.CAT[s.type]; return { ...s, typeStyle: badge(s.type), iconBg: c.bg, iconColor: c.text }; });
    return { types, skills };
  }
}
</script>
</body>
</html>
