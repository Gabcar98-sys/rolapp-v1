<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;}html,body{margin:0;padding:0;height:100%;}::selection{background:#3A2A21;}.scrl::-webkit-scrollbar{width:10px;}.scrl::-webkit-scrollbar-thumb{background:#3A342C;border-radius:8px;border:3px solid transparent;background-clip:content-box;}</style>
</helmet>
<div style="display:flex;height:100vh;width:100%;overflow:hidden;background:#1B1815;color:#ECE6DB;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;">
  <dc-import name="Sidebar" active="atributos" hint-size="236px,100%" style="flex:0 0 236px;height:100vh;"></dc-import>
  <main class="scrl" style="flex:1;overflow-y:auto;">
    <div style="max-width:900px;padding:34px 40px 60px;">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;">
        <div>
          <h1 style="font-family:'Newsreader',serif;font-size:32px;font-weight:600;margin:0 0 3px;letter-spacing:-.3px;color:#F4EFE6;">Bases de Atributos</h1>
          <p style="margin:0;color:#8A8175;font-size:14.5px;">Los atributos fundamentales sobre los que se construye cualquier ficha.</p>
        </div>
        <button style="display:flex;align-items:center;gap:7px;background:#CE6A3A;color:#1B1815;border:none;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;" style-hover="background:#D97C4E;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Nuevo atributo</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <sc-for list="{{ attrs }}" as="a" hint-placeholder-count="5">
          <div style="display:flex;align-items:center;gap:16px;background:#221E19;border:1px solid #2E2A24;border-radius:13px;padding:16px 20px;" style-hover="border-color:#4A4237;">
            <span style="width:44px;height:44px;border-radius:11px;background:{{ a.bg }};color:{{ a.color }};display:flex;align-items:center;justify-content:center;font-family:'Newsreader',serif;font-size:19px;font-weight:600;flex:0 0 auto;">{{ a.abbr }}</span>
            <div style="flex:1;min-width:0;">
              <div style="display:flex;align-items:center;gap:9px;"><span style="font-family:'Newsreader',serif;font-size:18px;font-weight:600;color:#F1ECE2;">{{ a.name }}</span><span style="font-size:11px;font-weight:600;color:#8A8175;background:#2A2620;padding:2px 8px;border-radius:20px;">rango {{ a.range }}</span></div>
              <p style="margin:3px 0 0;font-size:13px;color:#8A8175;line-height:1.4;">{{ a.desc }}</p>
            </div>
            <div style="display:flex;gap:4px;flex:0 0 auto;">
              <span style="width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#8A8175;cursor:pointer;" style-hover="background:#2E2A22;color:#ECE6DB;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6-11 11H3v-6z"></path></svg></span>
              <span style="width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#A87D72;cursor:pointer;" style-hover="background:#3A231F;color:#E4785E;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M6 7l1 13h10l1-13"></path></svg></span>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { attrs: [
      { abbr: 'FUE', name: 'Fuerza', range: '1–10', bg: '#38241B', color: '#E79B72', desc: 'Poder físico bruto. Rige el daño cuerpo a cuerpo y la carga.' },
      { abbr: 'DES', name: 'Destreza', range: '1–10', bg: '#22301E', color: '#9DC08B', desc: 'Agilidad y precisión. Afecta iniciativa, esquiva y ataques a distancia.' },
      { abbr: 'MEN', name: 'Mente', range: '1–10', bg: '#332B17', color: '#DBB55F', desc: 'Intelecto y voluntad. Base de las habilidades arcanas y de percepción.' },
      { abbr: 'VIT', name: 'Vitalidad', range: '1–10', bg: '#312330', color: '#CFA0BF', desc: 'Resistencia del cuerpo. Determina los puntos de vida máximos.' },
      { abbr: 'CAR', name: 'Carisma', range: '1–10', bg: '#2A2A33', color: '#A9AEC9', desc: 'Presencia e influencia social en negociaciones y liderazgo.' }
    ]};
  }
}
</script>
</body>
</html>
