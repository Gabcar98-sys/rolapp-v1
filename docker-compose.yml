services:
  backend:
    build: ./backend
    environment:
      - PORT=3001
      - DB_PATH=/app/data/rolapp.db
      - OLLAMA_BASE_URL=http://ollama:11434
      - EMBED_MODEL=nomic-embed-text
    volumes:
      - ./data:/app/data
    expose:
      - "3001"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # IA local opcional — habilitar con: docker compose --profile ai up
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
    restart: unless-stopped

volumes:
  ollama-data:
