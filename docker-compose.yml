services:
  backend:
    build: ./backend
    environment:
      - PORT=3001
      - DB_PATH=/app/data/rolapp.db
      # Motor de IA (turnkey): valores por defecto = Ollama local. Para usar una API
      # externa, define AI_PROVIDER=api / EMBED_PROVIDER=api + API_KEY en un .env (ver
      # .env.example) — no hay que tocar código.
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - EMBED_PROVIDER=${EMBED_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=http://ollama:11434
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - AI_MODEL=${AI_MODEL:-qwen2.5:3b}
      - API_KEY=${API_KEY:-}
      - AI_API_BASE_URL=${AI_API_BASE_URL:-}
      - EMBED_API_URL=${EMBED_API_URL:-}
    volumes:
      - ./data:/app/data
      # game-packs se monta como DATOS (no se hornea en la imagen): el seed de ejemplos
      # (scripts/seed-examples.js) los lee desde aquí, incluidos los .md de docs/ para RAG.
      - ./game-packs:/app/game-packs:ro
    expose:
      - "3001"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # IA local opcional — habilitar con: docker compose --profile ai up
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
    restart: unless-stopped

  # Bootstrap one-shot de modelos: descarga embeddings + LLM local en el volumen de
  # ollama. Idempotente. Correr con:  docker compose --profile ai run --rm ai-bootstrap
  ai-bootstrap:
    image: ollama/ollama:latest
    profiles: ["ai"]
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - AI_MODEL=${AI_MODEL:-qwen2.5:3b}
    entrypoint: ["/bin/sh", "/scripts/ai-bootstrap.sh"]
    volumes:
      - ./scripts:/scripts:ro
    restart: "no"

volumes:
  ollama-data:
