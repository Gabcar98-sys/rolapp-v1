server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Assets con hash de Vite (index-XXXX.js, etc.): el nombre cambia en cada build,
  # así que se pueden cachear "para siempre". immutable evita hasta la revalidacion
  # condicional. Nota: al tener su propio add_header, este location NO hereda otros
  # add_header (ni del server ni de otros location) — por eso lleva lo suyo aqui.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html debe revalidarse SIEMPRE: tras un deploy el navegador no debe servir
  # un bundle viejo (esta era la causa de los hard-refresh). Cubre el acceso directo
  # a /index.html.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA: cualquier ruta del cliente cae a index.html. Repetimos aqui el no-cache para
  # que la raiz "/" y el fallback del SPA sirvan siempre un index.html revalidado,
  # sin depender de que el redirect interno vuelva a resolver en "= /index.html".
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # Proxy de API al backend
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # /api/ai/ask (REST, sin streaming) con el LLM local en CPU tarda mas que el
    # proxy_read_timeout por defecto de nginx (60s) y devolvia 504 aunque la generacion
    # terminara bien. 300s cubre una respuesta lenta del modelo local.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Proxy de WebSocket (Socket.io)
  location /socket.io/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}
